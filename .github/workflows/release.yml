name: Build and test all three desktop clients
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows-x64
            arch: win64_msvc2022_64
          - os: macos-latest
            label: macOS
            arch: clang_64
          - os: ubuntu-24.04
            label: Linux-x64
            arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          modules: qtwebsockets
          cache: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 patchelf
      - name: macOS cryptography dependency
        if: runner.os == 'macOS'
        run: brew install libsodium
      - name: Windows cryptography dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libsodium:x64-windows-static-md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SODIUM_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> $env:GITHUB_ENV
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release "-DSODIUM_INCLUDE_DIR=$env:SODIUM_ROOT/include" "-DSODIUM_LIBRARY=$env:SODIUM_ROOT/lib/libsodium.lib"
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile and test encrypted transfer, resume, reconnect and unsafe offers
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure
      - name: Test Cloudflare relay
        shell: bash
        run: node --test relay/test/*.test.mjs
      - name: Package Windows portable client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory
          Copy-Item build/Release/mnTransfer.exe dist/
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath
          $env:VCINSTALLDIR = "$vs/VC/"
          windeployqt --release --no-translations --no-opengl-sw dist/mnTransfer.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $redist = Get-ChildItem "$vs/VC/Redist/MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Get-ChildItem "$($redist.FullName)/x64/Microsoft.VC*.CRT/*.dll" | Copy-Item -Destination dist/
          Copy-Item -Path README.md,LICENSE,THIRD_PARTY.md,PROTOCOL.md -Destination dist/
          @("Commit: $env:GITHUB_SHA", "Qt: 6.8.3", "Architecture: x64") | Set-Content dist/BUILD_INFO.txt
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" list | Add-Content dist/BUILD_INFO.txt
          Copy-Item "$env:SODIUM_ROOT/share/libsodium/copyright" dist/libsodium-LICENSE.txt
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:PATH = "C:/Windows/System32;C:/Windows;$(Resolve-Path dist)"
          $smoke = Start-Process dist/mnTransfer.exe -ArgumentList '--screenshot',"$PWD/dist/preview.png" -PassThru -Wait
          if ($smoke.ExitCode -ne 0 -or !(Test-Path dist/preview.png)) { throw 'Packaged GUI did not start' }
          Compress-Archive -Path dist/* -DestinationPath mnTransfer-Windows-x64.zip
      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          macdeployqt build/mnTransfer.app -always-overwrite
          mkdir dist
          cp -R build/mnTransfer.app dist/
          cp README.md LICENSE THIRD_PARTY.md PROTOCOL.md dist/
          printf 'Commit: %s\nQt: 6.8.3\nArchitecture: %s\n' "$GITHUB_SHA" "$(uname -m)" > dist/BUILD_INFO.txt
          brew list --versions libsodium >> dist/BUILD_INFO.txt
          ditto -c -k --sequesterRsrc --keepParent dist mnTransfer-macOS.zip
      - name: Package Linux client
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/lib dist/plugins
          cp build/mnTransfer dist/
          qtpaths --query QT_INSTALL_LIBS > /tmp/qtlib
          qtpaths --query QT_INSTALL_PLUGINS > /tmp/qtplugins
          for lib in Core Gui Widgets Network WebSockets DBus XcbQpa OpenGL; do
            cp -L "$(cat /tmp/qtlib)/libQt6${lib}.so.6" dist/lib/
          done
          mkdir -p dist/plugins/platforms
          for plugin in xcb offscreen minimal; do cp "$(cat /tmp/qtplugins)/platforms/libq${plugin}.so" dist/plugins/platforms/; done
          for folder in tls xcbglintegrations; do cp -R "$(cat /tmp/qtplugins)/$folder" dist/plugins/; done
          for lib in "$(cat /tmp/qtlib)"/libicu*.so*; do [ ! -e "$lib" ] || cp -a "$lib" dist/lib/; done
          cp -L /usr/lib/x86_64-linux-gnu/libsodium.so.23 dist/lib/
          cp packaging/run-linux.sh dist/run.sh
          chmod 755 dist/run.sh
          cp README.md LICENSE THIRD_PARTY.md PROTOCOL.md dist/
          printf 'Commit: %s\nQt: 6.8.3\nArchitecture: %s\n' "$GITHUB_SHA" "$(uname -m)" > dist/BUILD_INFO.txt
          dpkg-query -W libsodium23 >> dist/BUILD_INFO.txt
          patchelf --set-rpath '$ORIGIN/lib' dist/mnTransfer
          for lib in dist/lib/*.so*; do [ -L "$lib" ] || patchelf --set-rpath '$ORIGIN' "$lib"; done
          for plugin in dist/plugins/*/*.so; do patchelf --set-rpath '$ORIGIN/../../lib' "$plugin"; done
          env -u QT_PLUGIN_PATH QT_QPA_PLATFORM=offscreen dist/run.sh --screenshot dist/preview.png
          tar -C dist -czf mnTransfer-Linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mnTransfer-${{ matrix.label }}
          path: |
            mnTransfer-*.zip
            mnTransfer-*.tar.gz
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mnTransfer-*
          merge-multiple: true
          path: release
      - name: Attach source and relay deployment bundle
        run: |
          git archive --format=zip --output=release/mnTransfer-source.zip HEAD
          (cd relay && zip -r ../release/mnTransfer-Cloudflare-relay.zip package.json package-lock.json wrangler.jsonc src test README.md)
          (cd release && sha256sum * > SHA256SUMS)
      - name: Publish tested preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --prerelease --title "mnTransfer $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
